    <script>
      (function () {
        var html = document.documentElement;
        var body = document.body;
        var preloader = document.getElementById('com360-preloader');
        var msgEl = document.getElementById('com360-pre-msg');
        var pctEl = document.getElementById('com360-pre-pct');
        var DURATION = 3200;
        var startTime = performance.now();

        html.classList.add('com360-scroll-lock');
        body.classList.add('com360-scroll-lock');

        function getMessage(pct) {
          if (pct < 28) return 'Sintonizando señal COM360...';
          if (pct < 62) return 'Cargando 18+ expositores...';
          if (pct < 92) return 'Preparando agenda y conferencias...';
          return '¡Listo para comenzar!';
        }

        function finishPreloader() {
          var root = document.getElementById('root');
          if (root) {
            root.classList.add('com360-ready');
          }
          html.classList.remove('com360-scroll-lock');
          body.classList.remove('com360-scroll-lock');
          html.scrollTop = 0;
          body.scrollTop = 0;
          window.scrollTo(0, 0);

          if (preloader) {
            preloader.classList.add('com360-fade-out');
            setTimeout(function () {
              window.scrollTo(0, 0);
              if (preloader && preloader.parentNode) {
                preloader.remove();
              }
            }, 400);
          }
        }

        function update(now) {
          var elapsed = now - startTime;
          var ratio = Math.min(elapsed / DURATION, 1);
          var eased = 1 - Math.pow(1 - ratio, 1.6);
          var pct = Math.min(100, Math.round(eased * 100));

          if (pctEl) pctEl.textContent = pct + '%';
          if (msgEl) msgEl.textContent = getMessage(pct);

          if (ratio < 1) {
            requestAnimationFrame(update);
          } else {
            if (pctEl) pctEl.textContent = '100%';
            if (msgEl) msgEl.textContent = '¡Listo para comenzar!';
            finishPreloader();
          }
        }

        requestAnimationFrame(update);
      })();
    </script>

    <script>
      (function() {
        const originalTitle = 'COM360 | UCV 2026';
        const attentionTitle = '¡Regresa! 👀';
        let blinkInterval = null;

        document.addEventListener('visibilitychange', function() {
          if (document.hidden) {
            let isOriginal = false;
            document.title = attentionTitle;
            blinkInterval = setInterval(function() {
              document.title = isOriginal ? attentionTitle : originalTitle;
              isOriginal = !isOriginal;
            }, 1000);
          } else {
            if (blinkInterval) {
              clearInterval(blinkInterval);
              blinkInterval = null;
            }
            document.title = originalTitle;
          }
        });
      })();
    </script>
